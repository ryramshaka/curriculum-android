plugins { id 'com.android.application' }
android {
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    namespace 'com.curriculum.planner'
    compileSdk 35
    defaultConfig { testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
    defaultConfig { applicationId 'com.curriculum.planner'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
