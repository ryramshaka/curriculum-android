.program-toolbar .btn{white-space:nowrap;min-width:110px;padding:13px 18px;text-align:left;font-weight:750}
.no-wrap{white-space:nowrap;flex-shrink:0;padding:12px 16px!important;font-size:13px!important}
.program-content .flex.between>b{min-width:0;overflow-wrap:anywhere}
.program-content .flex.between>.btn{flex:0 0 auto;white-space:nowrap;min-width:max-content}
.master-input{grid-template-columns:minmax(0,1fr) 48px!important;gap:9px;width:100%}

.step-timer.running{color:#aa6220;font-weight:700}
.step-timer .timer-readout{display:block;font-variant-numeric:tabular-nums}
@media(max-width:650px){.program-content .card{padding:14px}.step-actions{padding:7px 2px}.program-toolbar{margin-bottom:12px}.program-toolbar .btn{font-size:16px}}
</style></head><body><div id="app"></div><script>

let db=parse(localStorage.getItem(KEY))||{programs:[],settings:{apiKey:'',model:'gpt-4.1-mini'},globalChat:[]};let screen='home',active=null,tab='coach',modal='',menuOpen=false,busy=false,error='',masterMonth=month(TODAY()),pendingAttachments=[],stepDetails=null,coachDraft='';function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage could not be saved. Export a backup.')}}function pget(){return db.programs.find(p=>p.id===active)}function relevant(p){return p.status==='active'&&p.start<=iso(TODAY())&&(!p.endDate||p.endDate>=iso(TODAY()))}function logsIn(p,a,b){return p.sessions.filter(s=>s.date>=a&&s.date<=b&&s.status!=='discarded')};function target(p,w){if(p.start>endWeek(w)||p.status!=='active'||(p.endDate&&p.endDate<w))return 0;const first=addDays(w,0);let days=0;for(let i=0;i<7;i++){const d=addDays(first,i);if(d>=p.start&&(!p.endDate||d<=p.endDate))days++}return days?Math.max(1,Math.round((p.weekly||1)*days/7)):0}function done(p,w){return logsIn(p,w,endWeek(w)).filter(s=>s.status==='complete').length};function weeklyStatus(p,w){let t=target(p,w),n=done(p,w);return !t?'future':n>=t?'complete':endWeek(w)<iso(TODAY())?'missed':n?'partial':'future'}function duration(p){return Math.max(5,Math.round(Number(p.duration)||30))}function roll(){let cur=month(TODAY());db.programs.forEach(p=>{if(p.status!=='active'||p.start>iso(TODAY())||(p.endDate&&p.endDate<iso(TODAY())))return;if(!p.curricula)p.curricula={};let ms=Object.keys(p.curricula).sort();let next=ms.length?ms[ms.length-1]:month(date(p.start));while(next<cur){let nd=date(next+'-01');nd.setMonth(nd.getMonth()+1);let nm=month(nd);if(!p.curricula[nm]){let base=p.curricula[next]||{text:'',version:0};p.curricula[nm]={text:base.text,version:1,carriedFrom:next,provisional:true};p.revisions.push({id:uid(),date:iso(TODAY()),kind:'month',large:true,status:'pending',title:`Review ${nm} curriculum`,before:base.text,after:base.text,reason:'Provisional rollover from previous approved curriculum. Ask function tickTimers(){if(screen!=='program'||tab!=='today')return;let t=timerScope();if(!t)return;document.querySelectorAll('[data-timer]').forEach(btn=>{let i=Number(btn.dataset.timer),rec=t.p.stepTimers?.[t.prefix+i],span=btn.querySelector('.timer-readout');if(!rec||!span)return;let elapsed=Number(rec.elapsed||0)+(rec.runningSince?Math.max(0,Math.floor((Date.now()-rec.runningSince)/1000)):0);let left=Math.max(0,Number(rec.target||0)-elapsed);span.textContent=(rec.runningSince?'⏸ ':'▶ ')+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');btn.classList.toggle('running',!!rec.runningSince);btn.title=rec.runningSince?'Pause timer':'Resume timer';});}
window.toggleTimer=(i,minutes)=>{let t=timerScope();if(!t)return;let p=t.p,key=t.prefix+i;p.stepTimers||={};let rec=p.stepTimers[key]||{elapsed:0,target:Math.max(0,minutes)*60,segments:[]};if(rec.runningSince){let end=Date.now(),seconds=Math.max(0,Math.floor((end-rec.runningSince)/1000));rec.elapsed+=seconds;rec.segments.push({start:new Date(rec.runningSince).toISOString(),end:new Date(end).toISOString(),seconds});rec.runningSince=null;}else{rec.runningSince=Date.now();if(!rec.target)rec.target=minutes*60;}p.stepTimers[key]=rec;save();tickTimers();};
setInterval(tickTimers,1000);
function render(){roll();document.getElementById('app').innerHTML=`<main class="app">${screen==='home'?home():screen==='program'?program():screen==='calendar'?calendar():overview()}</main>${nav()}${modal?dialog():''}`;let input=document.getElementById('coachmsg');if(input&&coachDraft){input.value=coachDraft}let chats=document.getElementById('chats');if(chats)chats.scrollTop=chats.scrollHeight;tickTimers()}
function val(id){return document.getElementById(id)?.value?.trim()||''}function notify(s){alert(s)}function pushRevision(p,r){let kind=r.kind||'plan',large=!!r.large,rev={id:uid(),date:iso(TODAY()),kind,large,status:large?'pending':'accepted',title:String(r.title||'Curriculum change'),before:String(r.before||''),after:String(r.after||''),reason:String(r.reason||''),month:month(TODAY())};p.revisions.push(rev);if(!large)applyRevision(p,rev);return rev}
function applyRevision(p,r){if(r.kind==='duration'){let n=Number(r.after);if(Number.isFinite(n)&&n>=5&&n<=480){p.duration=Math.round(n)}}else if(r.kind==='frequency'){let n=Number(r.after);if(n>=1&&n<=7)p.weekly=Math.round(n)}else if(r.kind==='plan'||r.kind==='month'){let m=r.month||month(TODAY());p.curricula[m]={text:r.after,version:(p.curricula[m]?.version||0)+1,provisional:false}}else if(r.kind==='context'){p.context.push({id:uid(),type:'Observation',text:r.after,date:iso(TODAY()),source:'AI revision'})}}
function revertRevision(p,r){if(r.status!=='accepted')return;if(r.kind==='duration')p.duration=Math.max(5,Number(r.before)||p.duration);else if(r.kind==='frequency')p.weekly=Number(r.before)||p.weekly;else if(r.kind==='plan'||r.kind==='month'){let m=r.month||month(TODAY());p.curricula[m]={text:r.before,version:(p.curricula[m]?.version||0)+1}}else if(r.kind==='context'){let i=p.context.findIndex(c=>c.text===r.after);if(i>=0)p.context.splice(i,1)}r.status='reverted'}
async function askAI(system,messages){if(!db.settings.apiKey)throw Error('Enter your OpenAI API key in Settings first.');const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+db.settings.apiKey},body:JSON.stringify({model:db.settings.model||'gpt-4.1-mini',temperature:0.3,response_format:{type:'json_object'},messages:[{role:'system',content:system},...messages]})});let raw=await res.text();let body=parse(raw);if(!res.ok)throw Error(body?.error?.message||'API request failed: '+res.status);let answer=parse(body?.choices?.[0]?.message?.content||'');if(!answer)throw Error('The AI did not return valid structured data.');return answer}
async function generatePlan(){let p=pget();if(!p||busy)return;if(!db.settings.apiKey){notify('Add your OpenAI API key in Settings to generate the curriculum.');return}busy=true;render();try{let m=month(TODAY())<month(date(p.start))?month(date(p.start)):month(TODAY());let win=monthWindow(p,m);let a=await askAI(`You are an expert curriculum designer. JSON ONLY: {"curriculum":"COMPLETE detailed first calendar month program text","rationale":"short explanation","metrics":[{"name":"...","unit":"..."}]}. Convert the goal into an ACTIONABLE curriculum, NOT a paraphrase. Program: ${JSON.stringify({name:p.name,goal:p.goal,start:p.start,month:m,activeFrom:win.begin,activeThrough:win.end,activeDaysThisMonth:win.days,weekPhasesThisMonth:win.phases,sessionsPerWeek:p.weekly,minutesPerSession:p.duration,programLength:p.lengthType==='months'?p.lengthMonths+' months':'ongoing',context:p.context})}. Format the curriculum in readable plain-text Markdown with clear headings starting "## Week 1: ...", subheadings like "### Session A: ...", and each action on its own numbered line. Never produce one dense paragraph. Include a monthly outcome, week-by-week progression, a distinct specific session template or rotating sessions with exact actions, steps/timings adding up to approximately ${p.duration} minutes; modifications/progression rules; measurable indicators. Work within ${p.weekly} flexible sessions weekly. For health and postpartum recovery: avoid promising cure or prescribing unsafe loads; progress based on symptoms and medical guidance and stop for worrying symptoms. If goal is underspecified, make cautious explicitly stated assumptions. IMPORTANT SCHEDULING: This calendar-month curriculum begins on ${win.begin} and ENDS on ${win.end}. There are ONLY ${win.days} active days, ${win.phases} program weeks/phases. Label the first phase Week 1 starting ${win.begin}, not the calendar week-of-month. DO NOT include or assign activities earlier than ${win.begin}. Only generate Week 1 through Week ${win.phases}, with the last phase truncated if shorter than 7 days. Prorate suggested session count in partial weeks. NEVER pretend the user completed or skipped sessions before program start. Next calendar month will restart at its own Week 1 with a monthly renewal. The program should cover only this active period of ${m}, while keeping the full program horizon in mind.`,[{role:'user',content:'Create the actual first-month curriculum based on my goal, not just the goal statement.'}]);let after=String(a.curriculum||'').trim();if(after.length<150)throw Error('The AI returned an incomplete plan. Please retry.');let prior=p.curricula[m]?.text||'';if(prior&&prior.trim()){p.revisions.push({id:uid(),date:iso(TODAY()),kind:'plan',large:true,status:'pending',title:'AI-generated curriculum for '+fmtMonth(m),before:prior,after,reason:String(a.rationale||'Generated from program goal'),month:m});notify('A complete proposed curriculum is in Revision history. Accept it to replace the current plan.')}else{p.curricula[m]={text:after,version:1,provisional:false};p.chat.push({role:'assistant',text:'I generated your initial curriculum for '+fmtMonth(m)+'. '+String(a.rationale||'You can review it in Plan.')})}for(let v of (a.metrics||[]).slice(0,6)){if(v.name&&!p.metrics.some(x=>x.name===v.name))p.metrics.push({id:uid(),name:String(v.name),unit:String(v.unit||''),values:[]})}}catch(e){notify('Curriculum generation failed: '+e.message)}finally{busy=false;save();render()}}
function aiSystem(p){return `You are an adaptive curriculum coach. Return ONLY a JSON object: {"reply":"plain language helpful response", "session":null or {"title":"...","date":"YYYY-MM-DD","status":"complete or partial","note":"...","minutes":number or null}, "revisions":[{"title":"...","kind":"plan|duration|frequency|context","before":"...","after":"...","reason":"...","large":boolean}], "context":[{"type":"Fact|Preference|Constraint|Observation|Goal","text":"..."}], "metrics":[{"name":"...","unit":"...","value":"..."}]}.
Date today: ${iso(TODAY())}. Program name: ${p.name}. Objective: ${p.goal}. Start: ${p.start}. Current curriculum phase: Week ${curriculumWeek(p,iso(TODAY()))} measured from the first ACTIVE day ${monthWindow(p,month(TODAY())).begin} of this calendar month, not from calendar month day 1. Never assign missed sessions before the start date. Planned program length: ${p.lengthType==='months'?p.lengthMonths+' months':'ongoing'}. Weekly flexible session goal: ${p.weekly}. Program-standard estimated duration: ${p.duration} minutes. Current monthly curriculum: ${JSON.stringify(p.curricula[month(TODAY())]||{})}. Context: ${JSON.stringify(p.context.slice(-35))}. Checklist progress (checked steps are completed without chat; do not re-log them): ${JSON.stringify(p.stepProgress||{})}. Timer records (elapsed time and start/stop segments reflect actual user timer interactions, not proof of work): ${JSON.stringify(Object.entries(p.stepTimers||{}).slice(-30))}. Recent sessions: ${JSON.stringify(p.sessions.slice(-40))}. Metrics: ${JSON.stringify(p.metrics.map(m=>({...m,values:m.values.slice(-8)})))}. Prior rejected/reverted revisions: ${JSON.stringify(p.revisions.filter(r=>r.status==='rejected'||r.status==='reverted').slice(-10))}.
Rules: infer a session ONLY when user explicitly reports having undertaken a real program session, not intentions, plans, or unrelated messages; completion only if reasonably complete, otherwise partial. Don't duplicate already recorded sessions if user is clarifying previous notes. Ask clarifying questions when necessary. Suggest context entries only for long-term useful information. Ask for relevant missing metrics periodically, not every time. Small safe changes may be applied immediately and be rejectable; large changes (goals, weekly frequency, major curriculum structure, large workload changes) MUST set large=true and await approval. For plan revisions 'before' and 'after' should be FULL curriculum text, not a fragment. Never claim an unapproved major change has been applied. Don't provide dangerous medical instructions. Duration changes should be proposed if repeated actual session duration suggests estimate is inaccurate. During first interaction generate a practical curriculum if current plan is vague, proposing a 'plan' revision. Always keep program sessions consistent with its standard time target.`}
async function sendCoach(){let p=pget(),txt=val('coachmsg');if((!txt&&!pendingAttachments.length)||busy)return;let attachments=pendingAttachments.splice(0);coachDraft='';p.chat.push({role:'user',text:txt||'Please review my attached material.',attachments});save();busy=true;error='';render();try{let a=await askAI(aiSystem(p),p.chat.slice(-18).map(c=>({role:c.role,content:c.attachments?.length?[{type:'text',text:c.text},...c.attachments.map(a=>a.kind==='image'?{type:'image_url',image_url:{url:a.data}}:{type:'text',text:'Attached file '+a.name+':\n'+a.text})]:c.text})));p.chat.push({role:'assistant',text:String(a.reply||'Updated.')});if(a.session?.status&&['complete','partial'].includes(a.session.status)){let s=a.session,day=/^\d{4}-\d\d-\d\d$/.test(s.date)?s.date:iso(TODAY());let dup=p.sessions.some(z=>z.date===day&&z.title===s.title);if(!dup)p.sessions.push({id:uid(),title:String(s.title||'Session'),date:day,status:s.status,note:String(s.note||txt),minutes:Number(s.minutes)||null,inferred:true})}for(let r of (a.revisions||[]).slice(0,6))pushRevision(p,r);for(let c of (a.context||[]).slice(0,6)){let text=String(c.text||'');if(text&&!p.context.some(x=>x.text===text))p.context.push({id:uid(),type:c.type||'Observation',text,date:iso(TODAY()),source:'Coach chat'})}for(let m of (a.metrics||[]).slice(0,5)){if(!m.name)continue;let item=p.metrics.find(x=>x.name.toLowerCase()===String(m.name).toLowerCase());if(!item){item={id:uid(),name:String(m.name),unit:String(m.unit||''),values:[]};p.metrics.push(item)}if(m.value!==undefined&&m.value!==null&&String(m.value).trim())item.values.push({date:iso(TODAY()),value:String(m.value)})}}catch(e){error=e.message;p.chat.push({role:'assistant',text:'AI request failed: '+e.message+' Your message is saved and you can try again.'})}busy=false;save();render()}
async function sendMaster(){let txt=val('mastermsg');if(!txt||busy)return;db.globalChat.push({role:'user',text:txt});busy=true;render();try{let programs=db.programs.filter(relevant).map(p=>({name:p.name,goal:p.goal,weekly:p.weekly,minutes:duration(p),completedThisWeek:done(p,startWeek(iso(TODAY()))),remaining:Math.max(0,target(p,startWeek(iso(TODAY())))-done(p,startWeek(iso(TODAY())))),curriculum:p.curricula[month(TODAY())]?.text,latestContext:p.context.slice(-8),latestSessions:p.sessions.slice(-5)}));let a=await askAI(`You are a cross-program daily planner. Today ${iso(TODAY())}. Programs are ordered strictly by estimated session duration, not priority. They have flexible weekly targets. Respond with JSON {"reply":"..."}. Recommend concrete sessions based on goals, remaining weekly sessions, feasibility and duration. Do not mark sessions done. Program data: ${JSON.stringify(programs)}`,db.globalChat.slice(-14).map(c=>({role:c.role,content:c.text})));db.globalChat.push({role:'assistant',text:String(a.reply||'No recommendation available.')})}catch(e){db.globalChat.push({role:'assistant',text:'AI request failed: '+e.message})}busy=false;save();render()}
async function reviewMonth(){let p=pget(),m=month(TODAY()),prev=date(m+'-01');prev.setMonth(prev.getMonth()-1);let pm=month(prev);let ss=p.sessions.filter(s=>s.date.startsWith(pm)),completed=ss.filter(s=>s.status==='complete').length;let targetMonth=0;for(let w=startWeek(pm+'-01');w<monthNext(pm);w=addDays(w,7)){let overlap=0;for(let i=0;i<7;i++){let d=addDays(w,i);if(d.startsWith(pm)&&d>=p.start)overlap++}targetMonth+=Math.round((p.weekly||1)*overlap/7)}if(!db.settings.apiKey){notify('Add your OpenAI key in Settings to generate a monthly reflection. The current curriculum is retained in the meantime.');return}busy=true;render();try{let a=await askAI(`Return JSON {"reply":"monthly reflection and evidence-based recommended carryover", "curriculum":"full proposed next/current month's curriculum text", "changes":"summary of major changes"}. Today ${iso(TODAY())}. Program ${JSON.stringify({name:p.name,goal:p.goal,frequency:p.weekly,duration:p.duration,oldCurriculum:p.curricula[pm],currentCurriculum:p.curricula[m],sessions: ss,metrics:p.metrics,context:p.context,previousMonth:pm,completed,approxTarget:targetMonth})}. Adaptive carryover: missed sessions are not debt; retain necessary prerequisites and progression, reschedule only important work, drop obsolete work, do not double workload. Monthly curriculum changes are major, require approval. Explain reflection and concrete changes.`,[{role:'user',content:'Review the previous calendar month and propose an adapted curriculum for this month.'}]);p.chat.push({role:'assistant',text:'Monthly reflection ('+fmtMonth(pm)+'):\n'+String(a.reply||'')});let before=p.curricula[m]?.text||p.curricula[pm]?.text||p.goal;let after=String(a.curriculum||before);p.revisions.push({id:uid(),date:iso(TODAY()),kind:'month',large:true,status:'pending',title:'Monthly curriculum proposal · '+fmtMonth(m),before,after,reason:String(a.changes||a.reply||'Monthly review'),month:m});tab='plan';notify('Monthly reflection added to Coach chat and proposed curriculum added to revision history for approval.')}catch(e){notify('Monthly review failed: '+e.message)}busy=false;save();render()}
window.act=(action,a,b)=>{let p=pget();switch(action){case'home':screen='home';active=null;modal='';break;case'back':screen='home';active=null;break;case'calendar':screen='calendar';active=null;break;case'progress':screen='progress';active=null;break;case'create':modal='create';break;case'settings':modal='settings';break;case'close':modal='';break;case'open':menuOpen=false;active=a;screen='program';tab=b==='plan'?'plan':'today';modal='';break;case'menu':menuOpen=!menuOpen;break;case'tab':tab=a;menuOpen=false;error='';break;case'monthShift':{let d=date(masterMonth+'-01');d.setMonth(d.getMonth()+Number(a));masterMonth=month(d);break}case'saveSettings':db.settings.apiKey=val('apikey');db.settings.model=val('model')||'gpt-4.1-mini';modal='';save();break;case'saveCreate':{let name=val('name'),goal=val('goal'),start=val('start'),newEndDate=val('newEndDate'),weekly=Number(val('weekly')),mins=Number(val('duration')),lengthType=val('lengthType'),lengthMonths=Number(val('lengthMonths'));if(!name||!start||!goal||(newEndDate&&newEndDate<start)||weekly<1||weekly>7||mins<5||mins>480||(!newEndDate&&lengthType==='months'&&(!Number.isInteger(lengthMonths)||lengthMonths<1||lengthMonths>120))){notify('Enter a name, description, valid date, 1–7 sessions per week and 5–480 minutes.');return}let id=uid(),m=month(date(start)),finish=date(start);finish.setMonth(finish.getMonth()+lengthMonths);finish.setDate(finish.getDate()-1);db.programs.push({id,name,goal,start,weekly,duration:mins,lengthType:newEndDate?'dates':lengthType,lengthMonths:!newEndDate&&lengthType==='months'?lengthMonths:null,endDate:newEndDate||(lengthType==='months'?iso(finish):null),status:'active',curricula:{[m]:{text:'',version:0,needsGeneration:true}},sessions:[],context:[],metrics:[],revisions:[],chat:[]});active=id;screen='program';tab='today';modal='';save();render();if(db.settings.apiKey){generatePlan();}else notify('Program saved. Add your API key in Settings, then tap Generate AI plan. Your goal has NOT been copied eturn;p.metrics.push({id:uid(),name:val('mname'),unit:val('munit'),values:[]});modal='';break;case'recordMetric':modal='recordMetric:'+a;break;case'saveMetricValue':{let m=p.metrics.find(m=>m.id===a);if(!val('mvalue'))return;m.values.push({date:val('mdate')||iso(TODAY()),value:val('mvalue')});modal='';break}case'deleteMetric':if(confirm('Delete metric and its history?'))p.metrics=p.metrics.filter(m=>m.id!==a);break;case'addContext':modal='addContext';break;case'editContext':modal='editContext:'+a;break;case'saveContext':{if(!val('ctext'))return;let c=p.context.find(x=>x.id===a);if(c){c.type=val('ctype');c.text=val('ctext')}else p.context.push({id:uid(),date:iso(TODAY()),type:val('ctype'),text:val('ctext'),source:'Manual'});modal='';break}case'deleteContext':if(confirm('Delete this context note?'))p.context=p.context.filter(x=>x.id!==a);break;case'manage':modal='manage';break;case'toggleArchive':p.status=p.status==='archived'?'active':'archived';modal='';screen='home';active=null;break;case'deleteProgram':if(confirm('PERMANENTLY delete this program and all of its chats, sessions and history?')){db.programs=db.programs.filter(x=>x.id!==active);active=null;screen='home';modal=''}break;case'archives':modal='archives';break;case'export':{if(window.AndroidBridge&&window.AndroidBridge.saveBackup){window.AndroidBridge.saveBackup(JSON.stringify(db,null,2));return;}let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='curriculum-backup-'+iso(TODAY())+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);return}default:break}save();render()};

window.toggleStep=(index,checked)=>{const p=pget();if(!p)return;const today=iso(TODAY()),wk=curriculumWeek(p,today),slot=(p.sessions||[]).filter(x=>x.status==='complete'&&x.date>=addDays(monthWindow(p,month(TODAY())).begin,(wk-1)*7)&&x.date<=today).length,prefix=month(TODAY())+':'+wk+':'+slot+':',key=prefix+index;p.stepProgress||={};p.stepProgress[key]=checked;
 // Count only steps actually presented in this week's curriculum. No AI call required.
 const rows=Array.from(document.querySelectorAll('.next-session-body .session-check-row'));const total=rows.length;
 const completed=rows.reduce((n,row,i)=>n+(i===index?checked:!!p.stepProgress[prefix+i]?1:0),0);
 const id='checklist:'+prefix;let log=p.sessions.find(s=>s.checklistId===id);const timers=Object.entries(p.stepTimers||{}).filter(([k])=>k.startsWith(prefix));const seconds=timers.reduce((n,[k,r])=>n+(r.elapsed||0)+(r.runningSince?Math.floor((Date.now()-r.runningSince)/1000):0),0);const intervals=timers.flatMap(([k,r])=>r.segments||[]);const timingNote=seconds?' · Timed '+Math.round(seconds/60*10)/10+' minutes'+(intervals.length?' · Start '+intervals[0].start+' · Stop '+intervals[intervals.length-1].end:''):'';
 if(completed>0&&total>0){const status=completed===total?'complete':'partial',note=completed+' of '+total+' activity steps checked off on Today'+timingNote;if(!log){log={id:uid(),checklistId:id,date:today,title:'Today checklist · Week '+wk,status,note,minutes:seconds?Math.round(seconds/60*10)/10:null,timerSegments:intervals,inferred:false};p.sessions.push(log)}else{log.status=status;log.note=note;log.date=today;log.minutes=seconds?Math.round(seconds/60*10)/10:null;log.timerSegments=intervals}}
 else if(log){p.sessions=p.sessions.filter(s=>s.id!==log.id)}
